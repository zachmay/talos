# Phase 4 portability audit (2026-03-28):
# - No Docker Desktop host-only networking references in default/prod profile
# - Safe to deploy on Linux Docker Engine without modification

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: talos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      VECTOR_DIMENSIONS: "${VECTOR_DIMENSIONS:-1536}"
    secrets:
      - db_password
      - mcp_password
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - backend
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talos"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  mcp:
    build:
      context: ./mcp
    restart: unless-stopped
    networks:
      - backend
      - frontend
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - mcp_password
      - agent_keys
      - embedding_api_key
    environment:
      DATABASE_URL: "postgresql://mcp_service:${MCP_SERVICE_PASSWORD}@db:5432/talos"
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-openrouter}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-openai/text-embedding-3-small}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY}"
      VECTOR_DIMENSIONS: "${VECTOR_DIMENSIONS:-1536}"
      CHUNK_SIZE: "${CHUNK_SIZE:-2000}"
      CHUNK_OVERLAP: "${CHUNK_OVERLAP:-200}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      ALLOWED_DOMAINS: "${ALLOWED_DOMAINS:-}"
      ALLOW_ALL_DOMAINS: "${ALLOW_ALL_DOMAINS:-false}"
      PORT: "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile.${AGENT_PROVIDER:-claude}
    read_only: true
    tmpfs:
      - /app/workspace:mode=755,uid=1000,gid=1000
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
      - seccomp:./agent/seccomp-standard.json
    cap_drop:
      - ALL
    networks:
      - frontend
    environment:
      - AGENT_PROFILE=${AGENT_PROFILE:-base-agent}
      - AGENT_LLM_PROVIDER=${AGENT_LLM_PROVIDER:-claude}
      - AGENT_LLM_MODEL=${AGENT_LLM_MODEL:-claude-sonnet-4-6}
      - MCP_SERVER_URL=${MCP_SERVER_URL:-http://mcp:3000/mcp}
      - AGENT_MAX_TOKENS=${AGENT_MAX_TOKENS:-16384}
    secrets:
      - agent_llm_key
      - agent_keys
    deploy:
      resources:
        limits:
          cpus: '${AGENT_CPU_LIMIT:-1.0}'
          memory: '${AGENT_MEMORY_LIMIT:-512M}'
    restart: on-failure:5
    volumes:
      - type: bind
        source: ./agents/${AGENT_PROFILE:-base-agent}
        target: /app/agent
        read_only: true
    stdin_open: true
    tty: true
    depends_on:
      - mcp

  # Strict sandbox profile — requires gVisor (runsc) installed on Linux host
  # Activate with: docker compose --profile strict up agent-strict
  agent-strict:
    extends:
      service: agent
    runtime: runsc
    profiles:
      - strict

networks:
  backend:
  frontend:

volumes:
  pgdata:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  mcp_password:
    file: ./secrets/mcp_password.txt
  agent_keys:
    file: ./secrets/agent_keys.json
  embedding_api_key:
    file: ./secrets/embedding_api_key.txt
  agent_llm_key:
    file: ./secrets/agent_llm_key.txt
