services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: talos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      VECTOR_DIMENSIONS: "${VECTOR_DIMENSIONS:-1536}"
    secrets:
      - db_password
      - mcp_password
    networks:
      - backend
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talos"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  mcp:
    build:
      context: ./mcp
    restart: unless-stopped
    networks:
      - backend
      - frontend
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - mcp_password
      - agent_keys
      - embedding_api_key
    environment:
      DATABASE_URL: "postgresql://mcp_service:${MCP_SERVICE_PASSWORD}@db:5432/talos"
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-openrouter}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-openai/text-embedding-3-small}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY}"
      VECTOR_DIMENSIONS: "${VECTOR_DIMENSIONS:-1536}"
      CHUNK_SIZE: "${CHUNK_SIZE:-2000}"
      CHUNK_OVERLAP: "${CHUNK_OVERLAP:-200}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      PORT: "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  agent:
    build:
      context: ./agent
    networks:
      - frontend

networks:
  backend:
  frontend:

volumes:
  pgdata:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  mcp_password:
    file: ./secrets/mcp_password.txt
  agent_keys:
    file: ./secrets/agent_keys.json
  embedding_api_key:
    file: ./secrets/embedding_api_key.txt
