# Phase 4 portability audit (2026-03-28):
# - No Docker Desktop host-only networking references in default/prod profile
# - Safe to deploy on Linux Docker Engine without modification

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: talos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      VECTOR_DIMENSIONS: "${VECTOR_DIMENSIONS:-1536}"
    secrets:
      - db_password
      - mcp_password
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - backend
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talos"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  mcp:
    build:
      context: ./mcp
    restart: unless-stopped
    networks:
      - backend
      - frontend
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - mcp_password
      - agent_keys
      - embedding_api_key
    environment:
      DATABASE_URL: "postgresql://mcp_service:${MCP_SERVICE_PASSWORD}@db:5432/talos"
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-openrouter}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-openai/text-embedding-3-small}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY}"
      VECTOR_DIMENSIONS: "${VECTOR_DIMENSIONS:-1536}"
      CHUNK_SIZE: "${CHUNK_SIZE:-2000}"
      CHUNK_OVERLAP: "${CHUNK_OVERLAP:-200}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      ALLOWED_DOMAINS: "${ALLOWED_DOMAINS:-}"
      ALLOW_ALL_DOMAINS: "${ALLOW_ALL_DOMAINS:-false}"
      PORT: "3000"
      MCP_SKIP_AUTH_INTERNAL: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  mongodb:
    image: mongo:8.0
    networks:
      - backend
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    ports:
      - "${LIBRECHAT_PORT:-3080}:3080"
    networks:
      - frontend
      - backend
    depends_on:
      - mongodb
      - mcp
    env_file:
      - ./librechat.env
    volumes:
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
        read_only: true
    restart: unless-stopped

networks:
  backend:
  frontend:

volumes:
  pgdata:
  mongodb_data:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  mcp_password:
    file: ./secrets/mcp_password.txt
  agent_keys:
    file: ./secrets/agent_keys.json
  embedding_api_key:
    file: ./secrets/embedding_api_key.txt
